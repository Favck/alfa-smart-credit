openapi: 3.0.3
info:
  title: Альфа.Поток — Backend API
  version: 0.1.0
  description: Черновой контракт Django ↔ Vue для хакатона.
paths:
  /api/v1/applications/:
    get:
      operationId: listClientApplications
      summary: Сохранённые заявки своей компании
      tags:
      - Заявки
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplicationPage'
          description: ''
    post:
      operationId: v1_applications_create
      summary: Создать черновик заявки
      tags:
      - Заявки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidApplicationWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ValidApplicationWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValidApplicationWriteRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/:
    get:
      operationId: v1_applications_retrieve
      summary: Карточка своей заявки
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Заявки
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
    patch:
      operationId: v1_applications_partial_update
      summary: Изменить черновик
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Заявки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApplicationPatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApplicationPatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApplicationPatchRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/cancel/:
    post:
      operationId: v1_applications_cancel_create
      summary: Отменить черновик или заявку на ручном рассмотрении
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Заявки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/documents/:
    get:
      operationId: v1_applications_documents_list
      description: 'Контракт для обсуждения. Бизнес-логика ещё не реализована: сейчас
        возвращается 501. '
      summary: '[ПЛАН] Документы своей заявки'
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Документы
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
          description: ''
        '400':
          description: Ошибка валидации параметров или полей запроса.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Действие недоступно в текущем статусе или конфликт версии данных.
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedError'
          description: ''
      x-implementation-status: planned
    post:
      operationId: v1_applications_documents_create
      description: 'Контракт для обсуждения. Бизнес-логика ещё не реализована: сейчас
        возвращается 501. Только DRAFT / NEED_INFO. Проверяются тип, размер и принадлежность
        заявки. Автоматическое извлечение показателей пока не предполагается.'
      summary: '[ПЛАН] Загрузить выписку или дополнительный документ'
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Документы
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
        '400':
          description: Ошибка валидации параметров или полей запроса.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Действие недоступно в текущем статусе или конфликт версии данных.
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedError'
          description: ''
      x-implementation-status: planned
  /api/v1/applications/{application_id}/documents/{document_id}/download/:
    get:
      operationId: v1_applications_documents_download_retrieve
      description: 'Контракт для обсуждения. Бизнес-логика ещё не реализована: сейчас
        возвращается 501. Сотрудник банка или владелец заявки. Ответ — файл с Content-Disposition:
        attachment. Конкретный Content-Type зависит от документа.'
      summary: '[ПЛАН] Скачать документ'
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: document_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Документы
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
        '400':
          description: Ошибка валидации параметров или полей запроса.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Действие недоступно в текущем статусе или конфликт версии данных.
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedError'
          description: ''
      x-implementation-status: planned
  /api/v1/applications/{application_id}/history/:
    get:
      operationId: v1_applications_history_list
