            schema:
              $ref: '#/components/schemas/ValidApplicationWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValidApplicationWriteRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLPreview'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
