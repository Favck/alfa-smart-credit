        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusEvent'
          description: ''
  /api/v1/applications/{application_id}/info-request/:
    get:
      operationId: v1_applications_info_request_retrieve
      description: 'Контракт для обсуждения. Бизнес-логика ещё не реализована: сейчас
