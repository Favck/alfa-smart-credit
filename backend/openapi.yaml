          - $ref: '#/components/schemas/NullEnum'
        to_status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        message:
          type: string
          description: В клиентском API — только безопасное для клиента описание.
        actor_role:
          $ref: '#/components/schemas/StatusEventActorRoleEnum'
        created_at:
          type: string
          format: date-time
      required:
      - actor_role
      - created_at
      - from_status
      - id
      - message
      - to_status
    StatusEventActorRoleEnum:
      enum:
      - client
      - bank
      - system
      type: string
      description: |-
        * `client` - client
        * `bank` - bank
        * `system` - system
    ValidApplicationWriteRequest:
      type: object
      properties:
        product_id:
          $ref: '#/components/schemas/ProductCodeEnum'
        amount:
          type: integer
          minimum: 50000
          description: Целые рубли. Дополнительно проверяется диапазон продукта.
        term_months:
          type: integer
          maximum: 120
          minimum: 1
        purpose:
          type: string
          maxLength: 1000
        monthly_revenue:
          type: integer
          minimum: 0
        current_monthly_payments:
          type: integer
          minimum: 0
      required:
      - amount
      - current_monthly_payments
      - monthly_revenue
      - product_id
      - term_months
    VerdictEnum:
      enum:
      - approve
      - counter
      - need_info
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `counter` - counter
        * `need_info` - need_info
        * `reject` - reject
    WorkflowDecisionRequest:
      type: object
      properties:
        verdict:
          $ref: '#/components/schemas/VerdictEnum'
        reason:
          type: string
          minLength: 1
          description: Обоснование обязательно для любого ручного решения.
          maxLength: 2000
        amount:
          type: integer
          minimum: 50000
          description: Обязательно для counter; для approve — если меняются условия.
        term_months:
          type: integer
          maximum: 120
          minimum: 1
          description: Обязательно для counter.
        annual_rate_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        requested_fields:
          type: array
          items:
            type: string
            minLength: 1
          description: Для need_info — перечень полей для уточнения.
        document_required:
          type: boolean
          description: Для need_info — требуется ли файл.
      required:
      - reason
      - verdict
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
