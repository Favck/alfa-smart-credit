components:
  schemas:
    Application:
      type: object
      properties:
        product_id:
          $ref: '#/components/schemas/ProductCodeEnum'
        amount:
          type: integer
          minimum: 50000
          description: Целые рубли. Дополнительно проверяется диапазон продукта.
        term_months:
          type: integer
          maximum: 60
          minimum: 1
        purpose:
          type: string
          maxLength: 1000
        monthly_revenue:
          type: integer
          minimum: 0
        current_monthly_payments:
          type: integer
          minimum: 0
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Номер для показа клиенту, например APP-1042.
        company_id:
          type: string
        company_name:
          type: string
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        status_label:
          type: string
        next_action:
          $ref: '#/components/schemas/NextActionEnum'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - amount
      - company_id
      - company_name
      - created_at
      - current_monthly_payments
      - id
      - monthly_revenue
      - next_action
      - number
      - product_id
      - status
      - status_label
      - term_months
      - updated_at
    ApplicationStatusEnum:
      enum:
      - DRAFT
      - SUBMITTED
      - CHECK
      - ENRICH
      - SCORING
      - REVIEW
      - APPROVED
      - COUNTER_OFFER
      - NEED_INFO
      - REJECTED
      - SIGNING
      - DISBURSED
      - CANCELLED
      type: string
      description: |-
        * `DRAFT` - DRAFT
        * `SUBMITTED` - SUBMITTED
        * `CHECK` - CHECK
        * `ENRICH` - ENRICH
        * `SCORING` - SCORING
        * `REVIEW` - REVIEW
        * `APPROVED` - APPROVED
        * `COUNTER_OFFER` - COUNTER_OFFER
        * `NEED_INFO` - NEED_INFO
        * `REJECTED` - REJECTED
        * `SIGNING` - SIGNING
        * `DISBURSED` - DISBURSED
        * `CANCELLED` - CANCELLED
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
    CategoryEnum:
      enum:
      - trade
      - production
      - construction
      - finance
      type: string
      description: |-
        * `trade` - trade
        * `production` - production
        * `construction` - construction
        * `finance` - finance
    ClientScoring:
      type: object
      properties:
        risk_label:
          type: string
        explanation:
          type: string
        reasons:
          type: array
          items:
            type: string
          description: Клиенту — понятные причины без внутренних правил и порогов.
      required:
      - explanation
      - reasons
      - risk_label
    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        inn:
          type: string
          description: 'Синтетический ИНН: 10 цифр для ООО, 12 для ИП.'
        ogrn:
          type: string
          description: ОГРН либо ОГРНИП. Данные вымышлены.
        legal_form:
          $ref: '#/components/schemas/LegalFormEnum'
        okved:
          type: string
        industry:
          type: string
        status:
          $ref: '#/components/schemas/CompanyStatusEnum'
        registered_at:
          type: string
          format: date
        monthly_revenue:
          type: integer
          minimum: 0
        current_monthly_payments:
          type: integer
          minimum: 0
      required:
      - current_monthly_payments
      - id
      - industry
      - inn
      - legal_form
      - monthly_revenue
      - name
      - ogrn
      - okved
      - registered_at
      - status
    CompanyStatusEnum:
      enum:
      - active
      - liquidating
      - liquidated
      - bankrupt
      type: string
      description: |-
        * `active` - active
        * `liquidating` - liquidating
        * `liquidated` - liquidated
        * `bankrupt` - bankrupt
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        profile_id:
          type: string
        company_id:
          type: string
          nullable: true
      required:
      - company_id
      - id
      - name
      - profile_id
      - role
    Decision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        verdict:
          $ref: '#/components/schemas/DecisionVerdictEnum'
        reason:
          type: string
        actor_role:
          $ref: '#/components/schemas/DecisionActorRoleEnum'
        created_at:
          type: string
          format: date-time
        application_status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
      required:
      - actor_role
      - application_id
      - application_status
      - created_at
      - id
      - reason
      - verdict
    DecisionActorRoleEnum:
      enum:
      - bank
      - system
      type: string
      description: |-
        * `bank` - bank
        * `system` - system
    DecisionVerdictEnum:
      enum:
      - approve
      - counter
      - need_info
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `counter` - counter
        * `need_info` - need_info
        * `reject` - reject
    DemoLoginRequest:
      type: object
      properties:
        profile_id:
          $ref: '#/components/schemas/DemoProfileIdEnum'
      required:
      - profile_id
    DemoProfile:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/DemoProfileIdEnum'
        name:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        company_id:
          type: string
          nullable: true
        scenario:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ScenarioEnum'
          - $ref: '#/components/schemas/NullEnum'
        description:
          type: string
      required:
      - company_id
      - description
      - id
      - name
      - role
      - scenario
    DemoProfileIdEnum:
      enum:
      - green
      - yellow
      - red
      - underwriter
