                $ref: '#/components/schemas/Error'
          description: Действие недоступно в текущем статусе или конфликт версии данных.
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedError'
          description: ''
      x-implementation-status: planned
  /api/v1/applications/{application_id}/info-requests/{info_request_id}/respond/:
    post:
      operationId: v1_applications_info_requests_respond_create
      description: 'Контракт для обсуждения. Бизнес-логика ещё не реализована: сейчас
        возвращается 501. Только NEED_INFO и открытый запрос этой заявки. После проверки
        полноты ответа возвращает заявку в ENRICH либо REVIEW с сохранением контекста.
        Не запускается автоматически при одной лишь загрузке файла.'
      summary: '[ПЛАН] Ответить на запрос банка'
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: info_request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Заявки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfoResponseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InfoResponseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InfoResponseRequest'
      security:
      - tokenAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
        '400':
          description: Ошибка валидации параметров или полей запроса.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Действие недоступно в текущем статусе или конфликт версии данных.
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedError'
          description: ''
      x-implementation-status: planned
  /api/v1/applications/{application_id}/offer/:
    get:
      operationId: v1_applications_offer_retrieve
      description: 'Контракт для обсуждения. Бизнес-логика ещё не реализована: сейчас
        возвращается 501. 404, если предложение ещё не сформировано.'
      summary: '[ПЛАН] Текущее предложение банка'
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Офферы
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
        '400':
          description: Ошибка валидации параметров или полей запроса.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
