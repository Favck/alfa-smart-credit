                $ref: '#/components/schemas/Error'
          description: Действие недоступно в текущем статусе или конфликт версии данных.
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedError'
          description: ''
      x-implementation-status: planned
  /api/v1/applications/{application_id}/offers/{offer_id}/accept/:
    post:
      operationId: v1_applications_offers_accept_create
      description: 'Контракт для обсуждения. Бизнес-логика ещё не реализована: сейчас
        возвращается 501. Принимает конкретную версию оффера, относящуюся к заявке.
        APPROVED / COUNTER_OFFER → SIGNING. Старый или уже отклонённый оффер → 409.'
      summary: '[ПЛАН] Принять условия банка'
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: offer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Офферы
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
        '400':
          description: Ошибка валидации параметров или полей запроса.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Действие недоступно в текущем статусе или конфликт версии данных.
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedError'
          description: ''
      x-implementation-status: planned
  /api/v1/applications/{application_id}/offers/{offer_id}/decline/:
    post:
      operationId: v1_applications_offers_decline_create
      description: 'Контракт для обсуждения. Бизнес-логика ещё не реализована: сейчас
        возвращается 501. APPROVED / COUNTER_OFFER → CANCELLED. Оффер должен принадлежать
        заявке.'
      summary: '[ПЛАН] Отклонить предложение'
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: offer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
