  /api/v1/applications/{application_id}/scoring/:
    get:
      operationId: v1_applications_scoring_retrieve
      summary: Понятное клиенту объяснение результата
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Скоринг
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientScoring'
          description: ''
  /api/v1/applications/{application_id}/sign/:
    post:
      operationId: v1_applications_sign_create
      description: 'Контракт для обсуждения. Бизнес-логика ещё не реализована: сейчас
        возвращается 501. Только SIGNING, актуальный договор этой заявки и consent=true.
        Записывает демо-подпись и переводит в DISBURSED. Повторный запрос не создаёт
        повторную выдачу. Реальных денежных или юридических операций нет.'
      summary: '[ПЛАН] Имитировать подписание договора и выдачу'
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Документы
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
        '400':
          description: Ошибка валидации параметров или полей запроса.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Действие недоступно в текущем статусе или конфликт версии данных.
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedError'
          description: ''
      x-implementation-status: planned
  /api/v1/applications/{application_id}/submit/:
    post:
      operationId: v1_applications_submit_create
      summary: Отправить заявку на проверку и ML-скоринг
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Заявки
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/demo-login/:
    post:
      operationId: v1_auth_demo_login_create
      description: Без пароля, только DEMO_MODE=true. Создайте пользователей командой
        seed_demo. Скопируйте token в Authorize в формате `Token <token>`.
      summary: Войти под выбранным демо-профилем
      tags:
      - Демо-вход
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
            examples:
              Клиент:ЗелёныйСценарий:
                value:
                  profile_id: green
                summary: 'Клиент: зелёный сценарий'
              СотрудникБанка:
                value:
                  profile_id: underwriter
                summary: Сотрудник банка
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
        '400':
          description: Неизвестный profile_id или ошибка валидации.
        '403':
          content:
            application/json:
              schema:
