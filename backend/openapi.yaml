openapi: 3.0.3
info:
  title: Альфа.Поток — Backend API
  version: 0.1.0
  description: API кредитного кабинета и банковского конвейера.
paths:
  /api/v1/applications/:
    get:
      operationId: listClientApplications
      summary: Сохранённые заявки своей компании
      tags:
      - Заявки
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplicationPage'
          description: ''
    post:
      operationId: v1_applications_create
      summary: Создать черновик заявки
      tags:
      - Заявки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidApplicationWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ValidApplicationWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValidApplicationWriteRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/:
    get:
      operationId: v1_applications_retrieve
      summary: Карточка своей заявки
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Заявки
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
    patch:
      operationId: v1_applications_partial_update
      summary: Изменить черновик
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Заявки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApplicationPatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApplicationPatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApplicationPatchRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/cancel/:
    post:
      operationId: v1_applications_cancel_create
      summary: Отменить черновик или заявку на ручном рассмотрении
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Заявки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/documents/:
    get:
      operationId: v1_applications_documents_list
      summary: Документы своей заявки
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Документы
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiveDocument'
          description: ''
    post:
      operationId: v1_applications_documents_create
      summary: Загрузить PDF или XLSX в черновик или ответ на дозапрос
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Документы
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveDocument'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/documents/{document_id}/download/:
    get:
      operationId: v1_applications_documents_download_retrieve
      summary: Защищённое скачивание документа
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: document_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Документы
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/applications/{application_id}/history/:
    get:
      operationId: v1_applications_history_list
      summary: История своей заявки
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Заявки
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusEvent'
          description: ''
  /api/v1/applications/{application_id}/info-request/:
    get:
      operationId: v1_applications_info_request_retrieve
      summary: Текущий дозапрос банка
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Заявки
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoRequest'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/info-requests/{info_request_id}/respond/:
    post:
      operationId: v1_applications_info_requests_respond_create
      summary: Ответить на запрос и вернуть заявку на рассмотрение
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: info_request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Заявки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfoResponseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InfoResponseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InfoResponseRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/offer/:
    get:
      operationId: v1_applications_offer_retrieve
      summary: Текущее предложение банка
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Офферы
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/offers/{offer_id}/accept/:
    post:
      operationId: v1_applications_offers_accept_create
      summary: Принять предложение и подготовить PDF-договор
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: offer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Офферы
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/offers/{offer_id}/decline/:
    post:
      operationId: v1_applications_offers_decline_create
      summary: Отклонить предложение и отменить заявку
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: offer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Офферы
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/scoring/:
    get:
      operationId: v1_applications_scoring_retrieve
      summary: Понятное клиенту объяснение результата
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Скоринг
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientScoring'
          description: ''
  /api/v1/applications/{application_id}/sign/:
    post:
      operationId: v1_applications_sign_create
      summary: Демонстрационное подписание и имитация выдачи
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Документы
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/submit/:
    post:
      operationId: v1_applications_submit_create
      summary: Отправить заявку на проверку и ML-скоринг
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Заявки
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveApplication'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/demo-login/:
    post:
      operationId: v1_auth_demo_login_create
      description: Без пароля, только DEMO_MODE=true. Создайте пользователей командой
        seed_demo. Скопируйте token в Authorize в формате `Token <token>`.
      summary: Войти под выбранным демо-профилем
      tags:
      - Демо-вход
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
            examples:
              Клиент:ЗелёныйСценарий:
                value:
                  profile_id: green
                summary: 'Клиент: зелёный сценарий'
              СотрудникБанка:
                value:
                  profile_id: underwriter
                summary: Сотрудник банка
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
        '400':
          description: Неизвестный profile_id или ошибка валидации.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/demo-profiles/:
    get:
      operationId: v1_auth_demo_profiles_list
      summary: Готовые профили для входа по клику
      tags:
      - Демо-вход
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoProfile'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      summary: Выйти и отозвать текущий токен
      tags:
      - Демо-вход
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      summary: Текущий пользователь
      tags:
      - Демо-вход
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/bank/applications/:
    get:
      operationId: listBankApplications
      summary: Сохранённые заявки для сотрудника банка
      tags:
      - Банк
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveBankApplicationPage'
          description: ''
  /api/v1/bank/applications/{application_id}/:
    get:
      operationId: v1_bank_applications_retrieve
      summary: Карточка с результатом модели и сведениями проверок
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Банк
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveBankApplication'
          description: ''
  /api/v1/bank/applications/{application_id}/decisions/:
    get:
      operationId: v1_bank_applications_decisions_list
      summary: История решений по заявке
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Банк
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Decision'
          description: ''
    post:
      operationId: v1_bank_applications_decisions_create
      summary: Решение, встречные условия или дозапрос по заявке
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Банк
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkflowDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkflowDecisionRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/bank/applications/{application_id}/documents/:
    get:
      operationId: v1_bank_applications_documents_list
      summary: Документы заявки для сотрудника банка
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Банк
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiveDocument'
          description: ''
  /api/v1/bank/applications/{application_id}/history/:
    get:
      operationId: v1_bank_applications_history_list
      summary: История статусов заявки
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Банк
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusEvent'
          description: ''
  /api/v1/company/:
    get:
      operationId: v1_company_retrieve
      summary: Компания текущего клиента
      tags:
      - Компания
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/consultations/:
    post:
      operationId: v1_consultations_create
      description: Асинхронный Chat Completions клиент. При сбое LLM возвращает валидный
        working_capital с is_fallback=true. LLM_ENABLED=false отключает сетевые вызовы
        и возвращает тот же базовый вариант. Рекомендация переносится в заявку; кредитное
        решение принимает основной конвейер. Не более 10 запросов в минуту на профиль.
      summary: Подобрать кредитный продукт по задаче бизнеса
      tags:
      - AI-консультант
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsultationWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsultationWriteRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductConsultation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      summary: Доступность Django и базы данных
      tags:
      - Система
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/news/:
    get:
      operationId: v1_news_list
      description: Без category клиент получает статьи своей отрасли и общие финансовые
        статьи; сотрудник банка — все. С category возвращаются все статьи выбранной
        категории. Локальные синтетические статьи, без LLM и внешних запросов.
      summary: Персональная лента новостей
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - construction
          - finance
          - production
          - trade
      tags:
      - Новости
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NewsItem'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/news/{news_id}/:
    get:
      operationId: v1_news_retrieve
      summary: Полный текст статьи
      parameters:
      - in: path
        name: news_id
        schema:
          type: integer
        required: true
      tags:
      - Новости
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/products/:
    get:
      operationId: v1_products_list
      summary: Каталог продуктов и допустимые параметры
      tags:
      - Продукты
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{product_id}/:
    get:
      operationId: v1_products_retrieve
      summary: Условия выбранного продукта
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
        required: true
      tags:
      - Продукты
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/scoring/pre-predict/:
    post:
      operationId: v1_scoring_pre_predict_create
      summary: Предварительная оценка параметров через ML
      tags:
      - Скоринг
      requestBody:
        content:
