      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
        '400':
          description: Ошибка валидации параметров или полей запроса.
