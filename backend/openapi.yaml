      description: |-
        * `green` - green
        * `yellow` - yellow
        * `red` - red
        * `underwriter` - underwriter
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/DocumentKindEnum'
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
      - application_id
      - content_type
      - created_at
