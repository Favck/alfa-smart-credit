name: alfa-potok
services:
  backend:
    image: alfa-potok-backend:${RELEASE_SHA:?Set RELEASE_SHA}
    restart: unless-stopped
    init: true
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: alpha.srv-node.com,localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://alpha.srv-node.com
      DEMO_MODE: "true"
    volumes:
      - /opt/alfa-potok/data:/app/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  frontend:
    image: alfa-potok-frontend:${RELEASE_SHA:?Set RELEASE_SHA}
    restart: unless-stopped
    ports:
      - 127.0.0.1:8092:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
