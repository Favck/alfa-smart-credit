name: alfa-potok
services:
  backend:
    image: alfa-potok-backend:${RELEASE_SHA:?Set RELEASE_SHA}
    restart: unless-stopped
    init: true
    environment:
      ML_BASE_URL: http://ml:8001
      ML_TIMEOUT_SECONDS: "2.5"
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: alpha.srv-node.com,localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://alpha.srv-node.com
      DEMO_MODE: "true"
    volumes:
      - /opt/alfa-potok/data:/app/data
    depends_on:
      ml:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  ml:
    image: alfa-potok-ml:${RELEASE_SHA:?Set RELEASE_SHA}
    restart: unless-stopped
    init: true
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,uuid,urllib.request;
          p=dict(request_id=str(uuid.uuid4()),application_id='healthcheck',product='working_capital',amount=500000,term_months=12,company_age_months=48,company_status='active',okved_group='10',monthly_revenue=1500000,current_monthly_payments=40000);
          r=urllib.request.Request('http://127.0.0.1:8001/api/v1/scoring/evaluate',data=json.dumps(p).encode(),headers={'Content-Type':'application/json'});
          d=json.load(urllib.request.urlopen(r,timeout=6));
          assert d['score'] is not None and len(d['reasons'])==5
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  frontend:
    image: alfa-potok-frontend:${RELEASE_SHA:?Set RELEASE_SHA}
    restart: unless-stopped
    ports:
      - 127.0.0.1:8092:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
