name: alfa-potok
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:5173:8000"
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
      DEMO_MODE: "true"
      ML_BASE_URL: http://ml:8001
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-alfa}
      POSTGRES_USER: ${POSTGRES_USER:-alfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-dummy}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen2.5:7b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-5.0}
    depends_on:
      db: {condition: service_healthy}
      ml: {condition: service_started}
    mem_limit: 384m
    volumes:
      - backend_data:/app/data
  ml:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ml
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    mem_limit: 384m
    cpus: 0.5
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfa}
      POSTGRES_USER: ${POSTGRES_USER:-alfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    command: [postgres, -c, shared_buffers=32MB, -c, work_mem=2MB, -c, max_connections=40]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  backend_data:
  postgres_data:
