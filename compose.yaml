services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
      DEMO_MODE: "true"
      ML_BASE_URL: "http://ml:8001"
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen2.5:7b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-5.0}
      LLM_ENABLED: ${LLM_ENABLED:-false}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - backend_data:/app/data

  ml:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ml
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    mem_limit: 384m
    cpus: 0.5

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_PROXY_TARGET: "http://backend:8000"
    depends_on:
      - backend

volumes:
  backend_data:
